<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <svg height="500" width="500" style="border: 1px solid red;">
        <line x1="0" y1="0" x2="500" y2="500" stroke-width="2" stroke="tomato" />
        <line x1="0" y1="500" x2="500" y2="0" stroke-width="2" stroke="tomato" />
    </svg>

    <svg height="500" width="500" style="border: 1px solid red;">
        <rect x="10" y="10" stroke-width="2" stroke="blue" height="200" width="200" fill="cyan" />
        <!-- rx and ry is used for the curveness of the rectangle -->
        <rect x="50" y="300" stroke-width="2" stroke="blue" height="100" width="100" rx="100" ry="100" fill="grey" />
    </svg>  

    <svg height="500" width="500" style="border: 1px solid yellow;">
        <circle cx="150" cy="100" r="50" fill="green" stroke="green" stroke-width="2" />
        <ellipse  cx="300" cy="300" r="50" fill="green" rx="50" ry="100" stroke="green" stroke-width="2"/>
    </svg>
</body>

</html>
