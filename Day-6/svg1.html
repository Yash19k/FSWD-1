<!DOCTYPE html>
<html lang="en">

</head>
<body>
    <svg height="500" width="500" style="border: 1px solid red;">
        <line x1="250" y1="50" x2="150" y2="200" stroke-width="2" stroke="tomato" />

        <circle cx="120" cy="120" r="80" fill="green"/>
