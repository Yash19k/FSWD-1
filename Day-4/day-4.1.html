<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table border="4" rules="all" cellpadding="40" >
        <thead>
            <tr>
                <th>Branch</th>
                <th>Student Name </th>
                <th>Roll No</th>
            </tr>
        </thead>
        <tbody align="center">
            <tr >
                <td rowspan="3">CS</td>
                <td>A</td>
                <td>1</td>
            </tr>
            <tr>
                <td>B</td>
                <td>2</td>
            </tr>
            <tr>
                <td>C</td>
                <td>3</td>
            </tr>
            <tr>
                <td rowspan="3">EC</td>
                <td>D</td>
                <td>1</td>
            </tr>
            <tr>
                <td>E</td>
                <td>2</td>
            </tr>
            <tr>
                <td>F</td>
                <td>3</td>
            </tr>
            </tbody>
        <tfoot>
            <tr>
                <td colspan="3" align="center">LJ 2025</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
